plugins { id 'com.android.library'; id 'maven-publish' }

android {
    namespace 'com.gkemon.XMLtoPDF'
    compileSdk 36
    defaultConfig {
        minSdk 21
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions { unitTests.includeAndroidResources = true }
    publishing { singleVariant('release') { withSourcesJar() } }
}
dependencies {
    api 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
}
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.Teamz-Lab-LTD'
                artifactId = 'Android-XML-to-PDF-Generator'
                version = '3.0.0'
                pom {
                    name = 'XML to PDF for Android'
                    description = 'Generate PDF documents from Android XML layouts and Views.'
                    url = 'https://github.com/Teamz-Lab-LTD/Android-XML-to-PDF-Generator'
                    licenses { license { name = 'Apache License 2.0'; url = 'https://www.apache.org/licenses/LICENSE-2.0' } }
                    scm { url = 'https://github.com/Teamz-Lab-LTD/Android-XML-to-PDF-Generator' }
                }
            }
        }
    }
}
