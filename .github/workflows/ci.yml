name: Verify PDF exports
on:
  push:
    branches: [master, main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :xml-to-pdf:testDebugUnitTest :sample:assembleDebug :sample:assembleDebugAndroidTest :sample:assembleRelease :sample:lintDebug :xml-to-pdf:lintDebug :compose-to-pdf:lintDebug :xml-to-pdf:publishReleasePublicationToMavenLocal :compose-to-pdf:publishReleasePublicationToMavenLocal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            **/build/reports/
            sample/build/outputs/apk/debug/
  android-device:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [28, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :sample:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-device-${{ matrix.api }}
          path: sample/build/reports/androidTests/
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/layout_to_pdf
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter pub get && flutter test && flutter build web
        working-directory: packages/layout_to_pdf/example
  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - name: Build for iOS Simulator
        run: xcodebuild -scheme LayoutToPDF -destination 'generic/platform=iOS Simulator' -derivedDataPath artifacts/apple-ci CODE_SIGNING_ALLOWED=NO build
