name: layout_to_pdf
description: Capture a rendered Flutter widget as paginated PDF bytes, with bounded image capture and explicit paper sizes.
version: 0.1.0
publish_to: none
repository: https://github.com/Teamz-Lab-LTD/Android-XML-to-PDF-Generator
environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'
dependencies:
  flutter:
    sdk: flutter
  pdf: ^3.11.3
  # image 4.11.0 calls an archive API absent in the resolved archive 4.0.9.
  image: ">=4.5.4 <4.11.0"
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
